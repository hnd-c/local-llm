[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docstack"
version = "0.1.0"
description = "Local RAG middleware with OCR, Chroma, and Ollama — Open WebUI compatible."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "chromadb>=0.4.22",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "markdown>=3.6",
  "ocrmypdf>=16.0.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "Pillow>=10.0.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "pytesseract>=0.3.10",
  "sentence-transformers>=3.0.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.29.0",
]

# Open WebUI (PyPI) does not support Python 3.13+ yet — use the same 3.11/3.12 venv as docstack.
[project.optional-dependencies]
webui = ["open-webui>=0.5.0"]

[project.scripts]
docstack = "docstack.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
