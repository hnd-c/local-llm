[llm]
# Models the app expects (fast/deep). These are NOT pip packages — install Ollama, then run:
#   docstack models pull
# so local Ollama has the same tags. Change this list if you switch models.
required_models = ["qwen3:4b", "qwen3:8b", "qwen2.5vl:7b"]
fast_model = "qwen3:4b"
deep_model = "qwen3:8b"
# Vision model for image Q&A (photos, screenshots).
# qwen2.5vl is significantly better than llava at reading text in images (OCR).
vision_model = "qwen2.5vl:7b"
ollama_url = "http://127.0.0.1:11434"
# Long Nepali government PDFs (~100 pages): wider context window (lower num_ctx if GPU OOMs).
num_ctx = 12288
max_ctx_chars = 30000
retrieval_top_k = 40
retrieval_min_score = 0.32
deep_model_num_gpu = 0
# RAG: only the last N user/assistant messages are sent (stops unrelated chat polluting doc tasks).
# 0 = unlimited (not recommended).
rag_max_history_messages = 32
# Broad queries (summarize / overview / Nepali equivalents): semantic hits + evenly spaced chunks.
# ~40 helps ~80–150 chunks (typical for long policy PDFs) see coverage in one turn.
rag_breadth_chunks = 40
rag_min_hits_floor = 18
# Quality single-pass: pack ALL chunks up to max_ctx_chars in one shot.
# Set high so this always fires for summarize/analysis queries — map-reduce is too slow
# on 4 GB GPU hardware. The actual context sent is capped by max_ctx_chars (30 K chars ≈
# 14–16 chunks of Nepali text), which fits comfortably in a 12 K-token context window.
full_context_max_chunks = 9999
# Map–reduce disabled: far too slow on 4 GB GPU (96 chunks = 10+ minutes).
# Re-enable on more powerful hardware by setting mapreduce_enabled = true.
mapreduce_enabled = false
mapreduce_min_chunks = 6
mapreduce_max_chunks = 96
mapreduce_concurrency = 3
mapreduce_reduce_batch = 12
mapreduce_reduce_input_chars = 14000
mapreduce_map_chunk_chars = 10000
mapreduce_deep_final_reduce = true

[ingest]
# Slightly larger chunks preserve Nepali sentences and numbered policy clauses across ~100-page files.
chunk_size = 2000
chunk_overlap = 220
min_chars_per_page = 50
# Multilingual embeddings (Nepali + English). After changing this, wipe data/chroma/ and re-ingest.
embedding_model = "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"

[paths]
data_dir = "data"
chroma_dir = "data/chroma"
uploads_dir = "data/uploads"
outputs_dir = "data/outputs"

# Leave empty to use OS default (see docstack.config.default_libreoffice_path)
libreoffice_path = ""
